# Yene Birr 4 — Build Android debug APK (NEW app, side-by-side)
# Path: .github/workflows/build-android.yml
# Artifact: yenebirr-debug-apk
# Package: com.melaku.yenebirr.v4  (does NOT replace the old app)

name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (use runner preinstall)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || \
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Build web assets (Vite)
        run: npm run build

      - name: Fresh Android platform (new appId)
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Capacitor (copy web → android)
        run: npx cap sync android

      - name: Copy launcher icons into Android res
        run: |
          if [ -f scripts/setup-native-plugin.cjs ]; then
            node scripts/setup-native-plugin.cjs || true
          fi
          RES=android/app/src/main/res
          if [ -d "$RES" ] && [ -d public/icons ]; then
            mkdir -p "$RES"/mipmap-{mdpi,hdpi,xhdpi,xxhdpi,xxxhdpi}
            [ -f public/icons/icon-48.png ]  && cp public/icons/icon-48.png  "$RES/mipmap-mdpi/ic_launcher.png"    && cp public/icons/icon-48.png  "$RES/mipmap-mdpi/ic_launcher_round.png"
            [ -f public/icons/icon-72.png ]  && cp public/icons/icon-72.png  "$RES/mipmap-hdpi/ic_launcher.png"    && cp public/icons/icon-72.png  "$RES/mipmap-hdpi/ic_launcher_round.png"
            [ -f public/icons/icon-96.png ]  && cp public/icons/icon-96.png  "$RES/mipmap-xhdpi/ic_launcher.png"   && cp public/icons/icon-96.png  "$RES/mipmap-xhdpi/ic_launcher_round.png"
            [ -f public/icons/icon-144.png ] && cp public/icons/icon-144.png "$RES/mipmap-xxhdpi/ic_launcher.png"  && cp public/icons/icon-144.png "$RES/mipmap-xxhdpi/ic_launcher_round.png"
            [ -f public/icons/icon-192.png ] && cp public/icons/icon-192.png "$RES/mipmap-xxxhdpi/ic_launcher.png" && cp public/icons/icon-192.png "$RES/mipmap-xxxhdpi/ic_launcher_round.png"
          fi

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -n 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found: $APK"
          ls -la "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yenebirr-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
